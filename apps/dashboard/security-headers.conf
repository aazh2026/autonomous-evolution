# 安全响应头。
#
# **单独一个文件，是因为 nginx 的 ``add_header`` 继承规则有个坑：**
# ``add_header`` 只在**当前层级没有定义任何 add_header 时**才从上层继承。
# 所以只要某个 ``location`` 里写了自己的 ``add_header``（比如给静态资源加
# Cache-Control），server 层的安全头就会在那个 location 里**全部消失** ——
# 而且不报错，只是悄悄没了。
#
# 解决办法就是：凡是自己写了 ``add_header`` 的 location，都把这个片段
# include 进来。这样安全头只有一份定义，不会漂移。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP。
#
# ``worker-src 'self' blob:`` 是给 PDF.js 用的 —— 它在 Web Worker 里解析
# 规范 PDF，没有这条会被浏览器拦下，症状是"证据区一片空白"，而控制台
# 只会留下一句不起眼的安全策略报错。
#
# ``style-src 'self' 'unsafe-inline'``：``unsafe-inline`` 看着刺眼，
# 但这里放行的是**样式属性**（预算条宽度、行内编辑的字号这类
# ``style={{...}}``），不是 ``<style>`` 块也不是脚本。禁掉它的话，
# 那些元素会直接不生效 —— 而样式失效是那种"没人会去看"的故障。
# 脚本那边是严的：``script-src 'self'``，一行 ``unsafe-inline`` 都没有。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
