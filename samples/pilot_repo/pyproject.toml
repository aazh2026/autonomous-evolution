[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinylib"
version = "0.3.0"
description = "试点仓库 —— 一个小而真的项目"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/tinylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = false
