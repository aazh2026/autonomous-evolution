# 演练脚本 —— M1 单轮闭环的那条链（TASK-P1-081 的 T1 用）。
#
# 这是**输入**，不是答案：它说"世界是什么样、Agent 会做什么、验证会怎么判"，
# 不说"这一轮应该是什么结果"。结果由系统算出来。
#
# **这份脚本是 M1 那条链的镜子。** 候选、评分、任务草稿与
# ``apps/director/m1_cycle.py`` 里手工注入的那一个**逐字对应** ——
# 同样的候选、同样的置信度与风险、同样的四项评分、同样的任务标识与标题。
# 换掉执行器与验证器之后，链路走出来的形状必须一样：同样十五个循环 B 的
# 节点、同样十一条循环 A 的事件、同样一串任务状态迁移。
#
# **它不写"结果"。** 决策由真的策略算，放行由真的
# ``agents.critic.approval.approval_for`` 翻译 —— 脚本只提供"模型会给出的
# 东西"。这里唯一被换掉的是执行器（打桩）与验证器（打桩）：M1 那条链真的
# 改了代码、真的跑了 pytest；这一条不打桩就跑不起来。
