# 演练脚本 —— Critic 否决。
#
# **决策 record ≠ 任务会被创建。** 决策说"值得做"，但放行凭据说"不放行"，
# 任务就不进路线图 —— 它连 ``APPROVED`` 都到不了（core/planning/roadmap.py
# 的 :func:`_why_not_planned`）。
#
# 否决的那一项必须是**可否决的检查**（agents/critic/checks.py 的
# ``VETOING_CHECKS``）—— 四问拿不出硬事实，用它们否决等于让否决理由经不起
# 复核。
