# Alembic 配置。
#
# 连接串**不写在这里** —— 连接串里有凭证。migrations/env.py 从运行配置
# （环境变量 / .env）读取连接串。把它留在版本库里，等于把数据库密码
# 提交进 Git。
#
# 需要临时指向别的库时用环境变量：
#   ASES_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/db alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# 迁移文件名用可读序号，便于按顺序阅读历史。
version_path_separator = os
# 空值：由 env.py 从 Settings 注入
sqlalchemy.url =

[post_write_hooks]
# 迁移里出现非 ASCII 注释是正常的（中文说明）。这里不做任何自动格式化，
# 避免格式化工具改动迁移内容导致校验和漂移。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
