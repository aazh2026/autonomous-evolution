[project]
name = "ases"
version = "0.1.0"
description = "Autonomous Software Evolution System (ASES) — 持续自演进型 AI 自主研发系统"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
s3 = ["aioboto3>=13.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "agents", "orchestration", "executors", "harness", "knowledge", "evaluation", "infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "PTH", "TID", "ARG", "PL"]
ignore = [
    "ANN401",  # 允许 Any（与 design.md R-014 的"指标类型可配"冲突，需显式收窄时再收紧）
    # 本项目文档与注释为中文，全角括号/引号是正常书写而非"易混淆字符"。
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "PLR2004"]
# 契约测试用的两个参考实现：方法签名由 Adapter 契约定死，实现里用不到的
# 参数是常态（不支持中断的实现里 session_id 就是要不到）；`_build_result`
# 的参数是统一结果的字段，逐个列出反而更清楚 —— 收成一个 dict 只会把
# "结果由哪些字段构成"藏进调用点的字典字面量里。
"tests/unit/executors/doubles.py" = ["ARG002", "PLR0913"]
# 健康检查的假实现：接口方法签名由契约定死，实现里用不到的参数是常态
# （比如 put_bytes 的 key 与 content_type —— 假后端不关心）。
"tests/unit/api/test_health.py" = ["ARG002"]
# 同理：假 git 实现 GitClient 协议，方法签名由契约定死 —— 内存里的假实现
# 不关心 repo 指向哪里、force 是什么，但签名必须一模一样，否则 mypy 会
# 判成"这个类没有实现那个协议"。
"tests/unit/harness/workspace/doubles.py" = ["ARG002"]
"**/__init__.py" = ["F401"]
# 仓储层的写方法把实体的字段一一对应成关键字参数 —— 参数多是有意的，
# 参数名本身就是文档。刻意逐列列出，比收成一个 dict 更难写错。
"infrastructure/database/repositories.py" = ["PLR0913"]
# 同理：`record_trace` 的参数就是 Langfuse 一条 trace 的字段
# （name/traceId/sessionId/input/output/metadata）。收成一个 payload dict
# 只会把这份契约藏进调用点的字典字面量里。
"infrastructure/observability/langfuse.py" = ["PLR0913"]
# Alembic 迁移是机器生成的：手写折行会与 `alembic revision` 的输出不一致，
# 下次 autogenerate 又会打回原形。迁移文件按生成物对待。
"migrations/versions/*.py" = ["E501"]
# 重写 Pydantic 的 `model_validate` 时把六个关键字参数逐字列出，是类型安全的
# 做法 —— 用 `**kwargs` 会把参数类型整个吞掉。参数多是被迫的，不是疏忽。
"core/project/models.py" = ["PLR0913"]
# 同理：`EvolutionCycle.build` 是周期记录的**唯一**构造入口，它把"结局"从
# 外部输入变成判定结果。所以字段必须逐个列全 —— 少传一个达成度快照，
# 没人会注意到，可它恰好是"这轮到底变没变好"的唯一依据。全部关键字参数，
# 参数名本身就是文档。
"core/metrics/cycle.py" = ["PLR0913"]
# 指标登记条目同理：`_define` 把 `MetricDefinition` 的六个字段一一对应成
# 参数。收成一个 dict 只会把"这个指标属于哪一层、单位是什么"这份契约
# 藏进调用点的字典字面量里 —— 而读注册表的人要能一眼看到它。
"evaluation/registry.py" = ["PLR0913", "PLR0917"]
# 沙箱描述的构造函数同理：`build_workspace_sandbox_spec` 的每一个参数都
# 是"沙箱长什么样"的一项独立事实（挂哪个目录、什么网络、用哪张镜像、
# 给哪些环境变量）。收成一个 dict 只会把这些事实塞进调用点的字典字面量
# 里，而这份描述恰恰是安全策略的输入 —— 它必须一眼可读。
"harness/sandbox/policy.py" = ["PLR0913"]
# codex 骨架：`summarize` 的签名由 Adapter 契约定死，而协议表还没填 ——
# 事件流读不出结论，参数用不到是常态，不是疏忽。
"executors/codex/events.py" = ["ARG001"]
# 打桩 CLI 的配置面：`write_stub` 的每个参数对应打桩 CLI 配置里的一项独立
# 事实（吐什么事件、退出码几、睡多久、stderr 写什么、报哪个会话 ID）。收成
# 一个 dict 只会把这些事实塞进调用点的字典字面量里 —— 而这份配置恰恰是
# "这次模拟的进程行为是什么"这份契约的输入，它必须一眼可读。
"tests/unit/executors/stub_cli.py" = ["PLR0913"]
# 取消链的"没有这一类资源"实现：`NoProcessStopper` 与 `NoContainerStopper`
# 的方法签名由端口协议定死，而它们**要的就是**不用那个参数 —— 没有进程就
# 没有进程要停，没有容器就没有容器要停。参数不用不是疏忽，是这两个实现
# 的全部含义。
"harness/sandbox/cancellation.py" = ["ARG002"]
# 取消链的测试替身：层与停止器的签名由端口协议定死，而替身**要的就是**
# 不用那些参数 —— 它们只关心"这一层有没有被走到"。参数不用不是疏忽，
# 是这些替身的全部含义。
"tests/unit/harness/sandbox/test_cancellation.py" = ["ARG002"]
# 验证引擎的测试替身：运行器协议的方法签名由 ``CheckRunner`` 契约定死，
# 而替身**要的就是**只用命令与结果 —— 工作区路径与超时对它没有意义。
"tests/unit/harness/verification/test_engine.py" = ["ARG002"]
# 授权测试的构造器：``_grant`` / ``_request`` 的每个参数都是"这条授权 /
# 这次请求的一项独立事实"（身份四要素 + 有效期 + 两道范围 + 资源）。
# 列全了才能一眼看出"改一个参数会改什么"；收成 dict 只会把这份契约藏进
# 调用点的字典字面量里。
# ``BrokenSink.record`` 的参数由留痕接口的签名定死 —— 假去处要的就是
# 写不成功，用不到那个参数。
"tests/unit/harness/security/test_authorization.py" = ["PLR0913", "ARG002"]
# 审计测试的假存储 ``BrokenStore``：``append`` / ``query`` 的签名由
# ``AuditStore`` 协议定死 —— 假存储要的就是**写不成功**，它压根不关心
# 写的是哪条记录、查的是哪张表。参数不用不是疏忽，是这个替身的全部含义。
"tests/unit/harness/security/test_audit.py" = ["ARG002"]
# 审计的写入口：``record_tool_call`` / ``audited_call`` 的每一个参数都是
# "这次工具调用的一项独立事实"（身份四要素 + 资源 + 操作 + 结果 + 判定 +
# 理由 + 会话）。列全了才能一眼看出"这条记录凭什么这么写"；收成一个 dict
# 只会把这份契约塞进调用点的字典字面量里 —— 而这份契约恰恰是"四要素齐不
# 齐"的唯一检查点，藏起来就没人看得见了。
"harness/security/audit.py" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# 与上面的 E501 豁免同源：迁移文件按 Alembic 的生成形态保存，不做手工折行。
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "agents", "orchestration", "executors", "harness", "knowledge", "evaluation", "infrastructure"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
# 禁止**显式**写出 `Any`。`Any` 与任何类型双向兼容 —— 一旦它出现在
# 签名里，类型检查在这一段就彻底失效，而且失效是静默的。
#
# **一个必须知道的例外**：Pydantic v2 的 `BaseModel.__init__(**data: Any)`
# 会被子类继承，mypy 把这个"继承来的 Any"记在**子类定义行**上 ——
# 于是任何定义 Pydantic 模型的模块都会报 explicit-any，与该模块自己
# 是否写了 `Any` 无关。这不是我们代码里的类型逃逸，是 mypy 对继承
# 成员的记账方式。
#
# 所以下面的 per-module override 只对"定义了 Pydantic 模型"的模块关掉
# 这一项检查；而"我们自己写的 Any 一律禁止"这条**真正要守的规则**，
# 由 `tests/unit/core/test_no_any_escape.py` 用 AST 精确检查 ——
# 那条检查只看我们写出来的注解，不看继承来的成员。
disallow_any_explicit = true
plugins = []
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
# 定义了 Pydantic 模型的模块 —— 见上面关于 `disallow_any_explicit` 的说明。
module = [
    "core.policy.autonomy",
    "core.policy.budget",
    "core.project.models",
    "core.metrics.cycle",
    "executors.base",
    "harness.verification.contract",
    "infrastructure.config.settings",
]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# S3 后端：aioboto3 / botocore 不发布类型标记，客户端的方法面是动态的
# （`client.put_object(...)` 的参数由 botocore 在运行时按服务模型校验）。
# 这里用 `Any` 是**如实**的 —— 换成 `object` 只会把"类型未知"伪装成
# "类型是 object"，而调用处的错误照样要到运行时才暴露。
# 本模块里能收紧的都收紧了（`dict[str, object]`、`Iterator[IO[bytes]]`）。
module = ["infrastructure.storage.object_store"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
# 测试里用 `Any` 造假数据是正当的：被断言的对象本身就是动态结构。
disallow_any_explicit = false

[[tool.mypy.overrides]]
# asyncpg 没有随包发布类型标记。它是运行时硬依赖（异步引擎的驱动），
# 但类型信息缺失不该阻塞其余代码的类型检查。
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aioboto3 / botocore 同样不发布类型标记（S3 后端的运行时依赖）。
# 对象存储后端本身有完整注解，缺的是 AWS SDK 的那层。
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: 需要外部服务（PostgreSQL / MinIO / Docker）的集成测试",
    "slow: 执行耗时较长的测试",
]
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*"]

[tool.coverage.run]
source = ["apps", "core", "agents", "orchestration", "executors", "harness", "knowledge", "evaluation", "infrastructure"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
